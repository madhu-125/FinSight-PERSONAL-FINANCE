spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finsight?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
finsight.otp.secret=${OTP_SECRET}
finsight.demo-auth.enabled=${DEMO_AUTH_ENABLED:false}
finsight.resend.api-key=${RESEND_API_KEY:}
finsight.resend.from-email=${RESEND_FROM_EMAIL:}
finsight.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
finsight.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
finsight.twilio.from-number=${TWILIO_FROM_NUMBER:}
finsight.client-origin=${CLIENT_ORIGIN:http://localhost:3000}
finsight.session.secure=${SESSION_COOKIE_SECURE:false}
