spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=FinSight
#server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:${MYSQL_URL:}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USERNAME:${DATABASE_USERNAME:}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${DATABASE_PASSWORD:}}}}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

finsight.otp.secret=${OTP_SECRET}
finsight.otp.console-delivery.enabled=${OTP_CONSOLE_DELIVERY_ENABLED:false}
finsight.demo-auth.enabled=${DEMO_AUTH_ENABLED:false}
finsight.google.client-id=${GOOGLE_CLIENT_ID:}
finsight.google.client-secret=${GOOGLE_CLIENT_SECRET:}
finsight.resend.api-key=${RESEND_API_KEY:}
finsight.resend.from-email=${RESEND_FROM_EMAIL:}
finsight.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
finsight.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
finsight.twilio.from-number=${TWILIO_FROM_NUMBER:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
finsight.mail.from=${SMTP_FROM_EMAIL:${RESEND_FROM_EMAIL:}}
finsight.client-origin=${CLIENT_ORIGIN:http://localhost:3000}
finsight.session.secure=${SESSION_COOKIE_SECURE:false}
